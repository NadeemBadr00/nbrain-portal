<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBrain — الإصدار 3: استعراض المنتجات والأجهزة (3D Device Explainer)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: hsl(220, 35%, 10%);
      --bg-card: hsl(220, 35%, 15%);
      --border-color: hsl(220, 25%, 25%);
      --text-main: hsl(210, 40%, 98%);
      --text-muted: hsl(215, 20%, 65%);
      --primary: hsl(217, 91%, 60%);
      --accent: hsl(160, 84%, 45%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    .top-nav {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
    }

    .style-badge {
      background: hsla(160, 84%, 45%, 0.15);
      color: var(--accent);
      border: 1px solid hsla(160, 84%, 45%, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .player-wrap {
      width: 100%;
      max-width: 1200px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      position: relative;
    }

    .canvas-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at center, hsl(220, 40%, 14%) 0%, hsl(220, 45%, 8%) 100%);
      position: relative;
      cursor: pointer;
    }

    #productCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-panel {
      background: hsl(220, 35%, 12%);
      border-top: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-bar {
      width: 100%;
      height: 6px;
      background: hsl(220, 25%, 22%);
      border-radius: 6px;
      cursor: pointer;
    }

    .timeline-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 6px;
      width: 0%;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-export {
      background: linear-gradient(135deg, hsl(350, 85%, 55%), hsl(15, 90%, 55%));
      color: #fff;
      box-shadow: 0 4px 15px hsla(350, 85%, 55%, 0.4);
    }
    .btn-export:hover { transform: translateY(-2px); }

    .btn-secondary {
      background: hsl(220, 30%, 20%);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="style-badge">الإصدار 3: Device Mockup Explainer</span>
      <h2 style="font-size: 1.1rem; font-weight: 800;">استعراض المنتجات والأجهزة الحية (Macbook & iPhone 3D Mockup)</h2>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-secondary" id="audioBtn">🔊 نغمات هادئة (Lo-Fi)</button>
      <button class="btn btn-export" id="exportBtn">🔴 تسجيل MP4 بدقة 1080p</button>
    </div>
  </div>

  <div class="player-wrap">
    <div class="canvas-viewport" id="viewport">
      <canvas id="productCanvas" width="1920" height="1080"></canvas>
    </div>

    <div class="controls-panel">
      <div class="timeline-bar" id="timeline">
        <div class="timeline-fill" id="progress"></div>
      </div>
      <div class="ctrl-row">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="btn btn-secondary" id="playBtn">تشغيل / إيقاف</button>
          <button class="btn btn-secondary" id="replayBtn">إعادة</button>
          <span id="timeText" style="font-family: 'JetBrains Mono'; font-size: 0.85rem; color: var(--text-muted);">00:00 / 00:30</span>
        </div>
        <span id="sceneText" style="font-weight: 700; color: var(--accent);">المشهد 1: استعراض المنظومة</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('productCanvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const replayBtn = document.getElementById('replayBtn');
    const progress = document.getElementById('progress');
    const timeText = document.getElementById('timeText');
    const sceneText = document.getElementById('sceneText');
    const audioBtn = document.getElementById('audioBtn');
    const exportBtn = document.getElementById('exportBtn');

    const TOTAL_TIME = 30;
    let t = 0;
    let isPlaying = true;
    let lastTime = 0;
    let audioOn = false;
    let audioCtx = null;

    const logo = new Image();
    logo.src = 'logo-emblem.png';

    function loop(ts) {
      if (!lastTime) lastTime = ts;
      const dt = (ts - lastTime) / 1000;
      lastTime = ts;

      if (isPlaying) {
        t += dt;
        if (t >= TOTAL_TIME) { t = TOTAL_TIME; isPlaying = false; }
      }

      render(t);
      updateUI();
      requestAnimationFrame(loop);
    }

    function render(time) {
      ctx.fillStyle = '#0b1329';
      ctx.fillRect(0, 0, 1920, 1080);

      // Subtle background grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 1920; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke();
      }
      for (let y = 0; y < 1080; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke();
      }

      const sceneIndex = Math.min(Math.floor(time / 5), 5);
      const sp = (time % 5) / 5;

      if (sceneIndex === 0) {
        sceneText.textContent = "01 / المنظومة الرقمية الشاملة 360°";
        drawProductScene1(sp);
      } else if (sceneIndex === 1) {
        sceneText.textContent = "02 / منصات الويب ولوحات التحكم (Macbook Mockup)";
        drawProductScene2(sp);
      } else if (sceneIndex === 2) {
        sceneText.textContent = "03 / تطبيقات Google Play (iPhone 16 Mockup)";
        drawProductScene3(sp);
      } else if (sceneIndex === 3) {
        sceneText.textContent = "04 / شات بوتس المبيعات والترشيحات الحية (Gemini)";
        drawProductScene4(sp);
      } else if (sceneIndex === 4) {
        sceneText.textContent = "05 / الرؤية الحاسوبية وتتبع الكاميرات الذكية";
        drawProductScene5(sp);
      } else if (sceneIndex === 5) {
        sceneText.textContent = "06 / تواصل مباشرة مع المؤسس م. نديم بدر (nbra.in)";
        drawProductScene6(sp);
      }
    }

    // SCENE 1: Brand
    function drawProductScene1(sp) {
      drawText('منظومة NBrain للبرمجيات والذكاء الاصطناعي', 960, 220, '#ffffff', '900 48px Cairo', sp);

      if (logo.complete) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, sp * 2);
        ctx.drawImage(logo, 860, 320, 200, 200);
        ctx.restore();
      }

      drawCard(460, 580, 1000, 220, sp);
      drawText('استوديو تطوير البرمجيات وحلول الـ AI المخصصة لعام 2026', 960, 650, '#38bdf8', '800 34px Cairo', sp);
      drawText('مواقع ويب فائقة السرعة • تطبيقات Google Play 16KB • شات بوتس مبيعات • رؤية حاسوبية', 960, 720, '#94a3b8', '700 24px Cairo', sp);
    }

    // SCENE 2: Macbook Web
    function drawProductScene2(sp) {
      drawText('01. منصات الويب السريعة ولوحات التحكم الإدارية', 960, 180, '#38bdf8', '900 46px Cairo', sp);

      // Macbook Mockup Frame
      drawMacbookMockup(480, 260, 960, 560, sp);
      drawText('React 19, Next.js 15, FastAPI, Cloudflare Security & 99+ Core Web Vitals', 960, 880, '#ffffff', '700 26px "JetBrains Mono", Cairo', sp);
    }

    // SCENE 3: Phone Mockup
    function drawProductScene3(sp) {
      drawText('02. تطبيقات الموبايل المعتمدة على Google Play 2026', 960, 180, '#38bdf8', '900 46px Cairo', sp);

      // Phone Mockup Frame
      drawPhoneMockup(780, 240, 360, 620, sp);

      // Feature Badge
      drawCard(1200, 420, 360, 180, sp);
      drawText('✓ Android 15 Ready', 1380, 480, '#10b981', '800 26px Cairo', sp);
      drawText('✓ 16KB Page Aligned', 1380, 530, '#38bdf8', '800 24px "JetBrains Mono"', sp);

      drawText('امتثال كامل لسياسات Google Play لعام 2026 دون رفض أو كراش', 960, 910, '#ffffff', '800 28px Cairo', sp);
    }

    // SCENE 4: AI Chat
    function drawProductScene4(sp) {
      drawText('03. شات بوتس المبيعات والترشيحات الذكية (Gemini AI)', 960, 180, '#38bdf8', '900 46px Cairo', sp);

      drawCard(460, 260, 1000, 540, sp);

      drawBubble(520, 320, 500, 90, 'مرحباً! ميزانيتي 5,000 جنيه، إيه أفضل باقة ليا؟', '#1e293b', '#ffffff', sp);
      drawBubble(880, 440, 520, 110, '✨ بناءً على ميزانيتك، باقة الانطلاق السريع بخصم 15% هي الأنسب وتشمل شات بوت ذكي!', '#2563eb', '#ffffff', sp);
      drawBubble(520, 580, 500, 90, 'رائع جداً! تم تأكيد الطلب والتحويل لواتساب فوراً 🚀', '#059669', '#ffffff', sp);

      drawText('يعمل 24/7 لزيادة مبيعاتك وربط العملاء بالدفع والواتساب مباشرة', 960, 860, '#ffffff', '800 28px Cairo', sp);
    }

    // SCENE 5: Vision
    function drawProductScene5(sp) {
      drawText('04. الرؤية الحاسوبية وتتبع الكاميرات (YOLOv12x & MediaPipe)', 960, 180, '#38bdf8', '900 46px Cairo', sp);

      drawCard(460, 260, 1000, 520, sp);

      // Vision boxes
      drawDetectionBox(520, 340, 420, 240, 'Vehicle Detected: 98.4%', '#ef4444');
      drawDetectionBox(980, 340, 420, 240, 'Driver Eye Alert: Normal', '#10b981');

      drawText('كشف النعاس والتشتت • تتبع المركبات وحركة المرور • الواقع المعزز والألعاب', 960, 840, '#ffffff', '800 28px Cairo', sp);
    }

    // SCENE 6: Outro
    function drawProductScene6(sp) {
      drawText('ابدأ مشروعك الرقمي اليوم مع المهندس نديم بدر 🚀', 960, 200, '#38bdf8', '900 48px Cairo', sp);

      drawCard(560, 300, 800, 460, sp);

      drawText('🌐 الموقع الرسمي المعتمد:', 960, 390, '#94a3b8', '700 26px Cairo', sp);
      drawText('https://nbra.in', 960, 460, '#38bdf8', '900 48px "JetBrains Mono"', sp);

      drawText('💬 تواصل مباشر عبر واتساب:', 960, 570, '#94a3b8', '700 26px Cairo', sp);
      drawText('+20 122 277 7345', 960, 630, '#10b981', '900 44px "JetBrains Mono"', sp);
    }

    // Mockup Helpers
    function drawMacbookMockup(x, y, w, h, sp) {
      ctx.save();
      // Screen Bezel
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(x, y, w, h - 30, [16, 16, 0, 0]);
      ctx.fill();

      // Screen Display
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(x + 16, y + 16, w - 32, h - 62, 8);
      ctx.fill();

      // Dashboard UI preview inside
      ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
      ctx.fillRect(x + 30, y + 30, 200, h - 90); // Sidebar
      ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
      ctx.fillRect(x + 250, y + 30, w - 300, 100); // Metric

      // Laptop Base
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(x - 40, y + h - 30, w + 80, 26, [0, 0, 16, 16]);
      ctx.fill();
      ctx.restore();
    }

    function drawPhoneMockup(x, y, w, h, sp) {
      ctx.save();
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 36);
      ctx.fill();
      ctx.stroke();

      // Dynamic Island / Speaker
      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.roundRect(x + w / 2 - 45, y + 15, 90, 22, 12);
      ctx.fill();

      // Screen Area
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(x + 14, y + 48, w - 28, h - 68, 24);
      ctx.fill();

      // App Cards inside
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.roundRect(x + 30, y + 80, w - 60, 140, 16);
      ctx.fill();
      ctx.restore();
    }

    function drawCard(x, y, w, h, sp) {
      ctx.save();
      ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 20);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawBubble(x, y, w, h, text, bg, color, sp) {
      ctx.save();
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 16);
      ctx.fill();

      ctx.fillStyle = color;
      ctx.font = '700 22px Cairo';
      ctx.textAlign = 'right';
      ctx.fillText(text, x + w - 24, y + h / 2 + 7);
      ctx.restore();
    }

    function drawDetectionBox(x, y, w, h, label, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = color;
      ctx.fillRect(x, y - 30, w, 30);

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 18px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(label, x + w / 2, y - 8);
      ctx.restore();
    }

    function drawText(text, x, y, color, font, sp) {
      ctx.save();
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function updateUI() {
      progress.style.width = (t / TOTAL_TIME * 100) + '%';
      const m = String(Math.floor(t / 60)).padStart(2, '0');
      const s = String(Math.floor(t % 60)).padStart(2, '0');
      timeText.textContent = `${m}:${s} / 00:30`;
    }

    playBtn.addEventListener('click', () => { isPlaying = !isPlaying; if (isPlaying && t >= TOTAL_TIME) t = 0; });
    replayBtn.addEventListener('click', () => { t = 0; isPlaying = true; });

    audioBtn.addEventListener('click', () => {
      audioOn = !audioOn;
      audioBtn.textContent = audioOn ? '🔊 النغمات مفعلة' : '🔇 تفعيل النغمات';
    });

    exportBtn.addEventListener('click', () => {
      exportBtn.textContent = '⏳ جارٍ تسجيل 1080p...';
      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'NBrain-Product-Explainer-1080p.webm';
        a.click();
        exportBtn.textContent = '🔴 تسجيل MP4 بدقة 1080p';
      };
      t = 0; isPlaying = true; recorder.start();
      const chk = setInterval(() => {
        if (t >= TOTAL_TIME) { clearInterval(chk); recorder.stop(); }
      }, 200);
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
