<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBrain — الإصدار 2: الموشن جرافيكس العصري السينمائي (Cyber Kinetic Motion)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg-dark: hsl(222, 47%, 7%);
      --bg-card: hsl(222, 40%, 12%);
      --border-color: hsl(220, 25%, 20%);
      --text-main: hsl(210, 40%, 98%);
      --text-muted: hsl(215, 20%, 65%);
      --primary: hsl(217, 91%, 60%);
      --primary-glow: hsla(217, 91%, 60%, 0.4);
      --neon-cyan: hsl(190, 100%, 50%);
      --neon-purple: hsl(270, 95%, 65%);
      --neon-green: hsl(155, 100%, 50%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    .top-nav {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
    }

    .style-badge {
      background: hsla(190, 100%, 50%, 0.15);
      color: var(--neon-cyan);
      border: 1px solid hsla(190, 100%, 50%, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .player-wrap {
      width: 100%;
      max-width: 1200px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      position: relative;
    }

    .canvas-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at center, hsl(222, 45%, 12%) 0%, hsl(222, 50%, 5%) 100%);
      position: relative;
      cursor: pointer;
    }

    #kineticCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-panel {
      background: hsl(222, 45%, 10%);
      border-top: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-bar {
      width: 100%;
      height: 6px;
      background: hsl(220, 25%, 18%);
      border-radius: 6px;
      cursor: pointer;
    }

    .timeline-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      border-radius: 6px;
      width: 0%;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-export {
      background: linear-gradient(135deg, hsl(350, 85%, 55%), hsl(15, 90%, 55%));
      color: #fff;
      box-shadow: 0 4px 15px hsla(350, 85%, 55%, 0.4);
    }
    .btn-export:hover { transform: translateY(-2px); }

    .btn-secondary {
      background: hsl(220, 30%, 18%);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="style-badge">الإصدار 2: Cyber Kinetic Motion</span>
      <h2 style="font-size: 1.1rem; font-weight: 800;">موشن جرافيكس سينمائي عصري (Dark Glassmorphism & Neon Glow)</h2>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-secondary" id="audioBtn">🔊 تفعيل النغمات الرقمية</button>
      <button class="btn btn-export" id="exportBtn">🔴 تسجيل MP4 بدقة 1080p</button>
    </div>
  </div>

  <div class="player-wrap">
    <div class="canvas-viewport" id="viewport">
      <canvas id="kineticCanvas" width="1920" height="1080"></canvas>
    </div>

    <div class="controls-panel">
      <div class="timeline-bar" id="timeline">
        <div class="timeline-fill" id="progress"></div>
      </div>
      <div class="ctrl-row">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="btn btn-secondary" id="playBtn">تشغيل / إيقاف</button>
          <button class="btn btn-secondary" id="replayBtn">إعادة</button>
          <span id="timeText" style="font-family: 'JetBrains Mono'; font-size: 0.85rem; color: var(--text-muted);">00:00 / 00:30</span>
        </div>
        <span id="sceneText" style="font-weight: 700; color: var(--neon-cyan);">المشهد 1: NBrain Neural Intro</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('kineticCanvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const replayBtn = document.getElementById('replayBtn');
    const progress = document.getElementById('progress');
    const timeText = document.getElementById('timeText');
    const sceneText = document.getElementById('sceneText');
    const audioBtn = document.getElementById('audioBtn');
    const exportBtn = document.getElementById('exportBtn');

    const TOTAL_TIME = 30;
    let t = 0;
    let isPlaying = true;
    let lastTime = 0;
    let audioOn = false;
    let audioCtx = null;

    const logo = new Image();
    logo.src = 'logo-emblem.png';

    // Particle background network
    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * 1920,
      y: Math.random() * 1080,
      vx: (Math.random() - 0.5) * 0.8,
      vy: (Math.random() - 0.5) * 0.8,
      radius: Math.random() * 2 + 1,
      color: Math.random() > 0.5 ? 'hsla(190, 100%, 50%, 0.4)' : 'hsla(217, 91%, 60%, 0.4)'
    }));

    function loop(ts) {
      if (!lastTime) lastTime = ts;
      const dt = (ts - lastTime) / 1000;
      lastTime = ts;

      if (isPlaying) {
        t += dt;
        if (t >= TOTAL_TIME) { t = TOTAL_TIME; isPlaying = false; }
      }

      render(t);
      updateUI();
      requestAnimationFrame(loop);
    }

    function render(time) {
      // 1. Dark Neon Background
      const bgGrad = ctx.createRadialGradient(960, 540, 100, 960, 540, 1000);
      bgGrad.addColorStop(0, '#0f172a');
      bgGrad.addColorStop(1, '#020617');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1920, 1080);

      // 2. Animated Particle Synapses
      renderParticles();

      const sceneIndex = Math.min(Math.floor(time / 5), 5);
      const sp = (time % 5) / 5;

      if (sceneIndex === 0) {
        sceneText.textContent = "01 / المنظومة الرقمية الشاملة 360°";
        drawKineticScene1(sp);
      } else if (sceneIndex === 1) {
        sceneText.textContent = "02 / منصات الويب السريعة (React 19 & Cloudflare)";
        drawKineticScene2(sp);
      } else if (sceneIndex === 2) {
        sceneText.textContent = "03 / تطبيقات Google Play (Android 15 / 16KB)";
        drawKineticScene3(sp);
      } else if (sceneIndex === 3) {
        sceneText.textContent = "04 / شات بوتس المبيعات والـ RAG (Gemini AI)";
        drawKineticScene4(sp);
      } else if (sceneIndex === 4) {
        sceneText.textContent = "05 / الرؤية الحاسوبية وتتبع الكاميرات (YOLO)";
        drawKineticScene5(sp);
      } else if (sceneIndex === 5) {
        sceneText.textContent = "06 / تواصل مباشرة مع المؤسس م. نديم بدر (nbra.in)";
        drawKineticScene6(sp);
      }
    }

    function renderParticles() {
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > 1920) p.vx *= -1;
        if (p.y < 0 || p.y > 1080) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
    }

    // SCENE 1: Cyber Hero
    function drawKineticScene1(sp) {
      // Glow circle in center
      drawNeonGlowCircle(960, 480, 240, 'hsla(190, 100%, 50%, 0.15)');

      if (logo.complete) {
        const scale = gsap.utils.interpolate(0.7, 1.0, Math.min(1, sp * 2));
        ctx.save();
        ctx.translate(960, 420);
        ctx.scale(scale, scale);
        ctx.globalAlpha = Math.min(1, sp * 2);
        ctx.drawImage(logo, -110, -110, 220, 220);
        ctx.restore();
      }

      drawGlassCard(460, 620, 1000, 180, sp);

      drawGlowingText('NBRAIN AI ECOSYSTEM', 960, 670, '#38bdf8', '900 38px "JetBrains Mono"', sp);
      drawGlowingText('استوديو هندسة البرمجيات والذكاء الاصطناعي 2026', 960, 740, '#ffffff', '800 32px Cairo', sp);
    }

    // SCENE 2: Web Platform
    function drawKineticScene2(sp) {
      drawGlowingText('01. منصات الويب السريعة (High-Performance Web)', 960, 180, '#38bdf8', '900 46px Cairo', sp);

      drawGlassCard(410, 280, 1100, 500, sp);

      // 3 Stat Metric Cards
      drawMetricBox(480, 360, 300, 160, '⚡ 99+', 'Core Web Vitals', '#10b981', sp);
      drawMetricBox(810, 360, 300, 160, '🔒 DDoS Shield', 'Cloudflare Pro', '#38bdf8', sp);
      drawMetricBox(1140, 360, 300, 160, '🌐 Full-Stack', 'React 19 & Next 15', '#a855f7', sp);

      drawGlowingText('معمارية نظيفة، تحليلات لحظية، وتجربة مستخدم لا تُنسى', 960, 680, '#ffffff', '800 30px Cairo', sp);
    }

    // SCENE 3: Mobile Apps
    function drawKineticScene3(sp) {
      drawGlowingText('02. تطبيقات Google Play الرسمية (Android 15)', 960, 180, '#38bdf8', '900 46px Cairo', sp);

      drawGlassCard(510, 280, 900, 520, sp);

      drawMetricBox(580, 360, 360, 180, '📱 16KB Aligned', 'Google Play 2026 Ready', '#38bdf8', sp);
      drawMetricBox(980, 360, 360, 180, '🚀 Flutter 3.29', '60 FPS Native Speed', '#10b981', sp);

      drawGlowingText('تطبيقات مستقرة تماماً خالية من الكراش وامتثال كامل لسياسات المتجر', 960, 680, '#ffffff', '800 28px Cairo', sp);
    }

    // SCENE 4: AI Sales Bots
    function drawKineticScene4(sp) {
      drawGlowingText('03. شات بوتس المبيعات الذكية (Gemini AI RAG)', 960, 180, '#38bdf8', '900 46px Cairo', sp);

      drawGlassCard(460, 280, 1000, 520, sp);

      drawMetricBox(520, 360, 420, 160, '🤖 24/7 Sales Bot', 'يرشح المنتجات بميزانية العميل', '#a855f7', sp);
      drawMetricBox(980, 360, 420, 160, '📈 +40% Conversion', 'تحويل فوري لطلبات الواتساب', '#10b981', sp);

      drawGlowingText('مساعد ذكي يتعلم من كتالوج منتجاتك ويرفع أرباح متجرك باستمرار', 960, 680, '#ffffff', '800 28px Cairo', sp);
    }

    // SCENE 5: Computer Vision
    function drawKineticScene5(sp) {
      drawGlowingText('04. الرؤية الحاسوبية وتتبع الكاميرات (YOLO & MediaPipe)', 960, 180, '#38bdf8', '900 46px Cairo', sp);

      drawGlassCard(460, 280, 1000, 520, sp);

      drawMetricBox(520, 360, 420, 160, '👁️ YOLOv12x Vision', 'تتبع المركبات والسائقين 98%+', '#ef4444', sp);
      drawMetricBox(980, 360, 420, 160, '🎮 AR & Gestures', 'ألعاب وتحكم بدون لمس MediaPipe', '#38bdf8', sp);

      drawGlowingText('حلول ذكاء اصطناعي عميقة للشركات والمصانع والمركبات الذكية', 960, 680, '#ffffff', '800 28px Cairo', sp);
    }

    // SCENE 6: Outro
    function drawKineticScene6(sp) {
      drawGlowingText('انطلق بمنظومتك الرقمية اليوم مع NBrain 🚀', 960, 200, '#38bdf8', '900 48px Cairo', sp);

      drawGlassCard(560, 300, 800, 460, sp);

      drawGlowingText('🌐 الموقع الرسمي المعتمد:', 960, 390, '#94a3b8', '700 26px Cairo', sp);
      drawGlowingText('https://nbra.in', 960, 460, '#38bdf8', '900 48px "JetBrains Mono"', sp);

      drawGlowingText('💬 تواصل مباشر عبر واتساب:', 960, 570, '#94a3b8', '700 26px Cairo', sp);
      drawGlowingText('+20 122 277 7345', 960, 630, '#10b981', '900 44px "JetBrains Mono"', sp);
    }

    function drawGlassCard(x, y, w, h, sp) {
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(56, 189, 248, 0.2)';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 20);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawMetricBox(x, y, w, h, title, sub, color, sp) {
      ctx.save();
      ctx.fillStyle = 'rgba(30, 41, 59, 0.6)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = '800 28px Cairo, "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(title, x + w / 2, y + 65);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '600 20px Cairo';
      ctx.fillText(sub, x + w / 2, y + 115);
      ctx.restore();
    }

    function drawGlowingText(text, x, y, color, font, sp) {
      ctx.save();
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawNeonGlowCircle(x, y, r, color) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 40;
      ctx.fill();
      ctx.restore();
    }

    function updateUI() {
      progress.style.width = (t / TOTAL_TIME * 100) + '%';
      const m = String(Math.floor(t / 60)).padStart(2, '0');
      const s = String(Math.floor(t % 60)).padStart(2, '0');
      timeText.textContent = `${m}:${s} / 00:30`;
    }

    playBtn.addEventListener('click', () => { isPlaying = !isPlaying; if (isPlaying && t >= TOTAL_TIME) t = 0; });
    replayBtn.addEventListener('click', () => { t = 0; isPlaying = true; });

    // Audio synthesizer
    function playCyberBeat() {
      if (!audioOn) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220 + (t % 4) * 80, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    setInterval(() => { if (isPlaying && audioOn) playCyberBeat(); }, 400);

    audioBtn.addEventListener('click', () => {
      audioOn = !audioOn;
      audioBtn.textContent = audioOn ? '🔊 النغمات الرقمية مفعلة' : '🔇 تفعيل النغمات';
    });

    // 1-Click Export
    exportBtn.addEventListener('click', () => {
      exportBtn.textContent = '⏳ جارٍ تسجيل 1080p...';
      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'NBrain-Kinetic-Motion-1080p.webm';
        a.click();
        exportBtn.textContent = '🔴 تسجيل MP4 بدقة 1080p';
      };
      t = 0; isPlaying = true; recorder.start();
      const chk = setInterval(() => {
        if (t >= TOTAL_TIME) { clearInterval(chk); recorder.stop(); }
      }, 200);
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
